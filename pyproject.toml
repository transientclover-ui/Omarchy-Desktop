[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-desktop"
version = "0.1.0"
description = "Read-only Omarchy desktop chooser and safe AI task generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "transientclover-ui"}]
dependencies = []

[project.scripts]
omarchy-desktop = "omarchy_desktop.cli:main"

[tool.setuptools.packages.find]
include = ["omarchy_desktop*"]
